[workspace]
resolver = "3"
members = ["crates/blaze-sys", "crates/blaze"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
memmap2 = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = "line-tables-only"
