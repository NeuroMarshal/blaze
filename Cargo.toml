[workspace]
resolver = "3"
members = ["crates/blaze-sys", "crates/blaze", "crates/blaze-chat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
memmap2 = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# shared with crates/blaze-chat (vendored from SGLang, Apache-2.0)
async-stream = "0.3"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"

[profile.release]
debug = "line-tables-only"
