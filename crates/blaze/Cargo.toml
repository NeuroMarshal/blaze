[package]
name = "blaze"
description = "LLM inference runtime: Rust host, CUDA C++ kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "blaze"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
blaze-sys = { path = "../blaze-sys" }
anyhow.workspace = true
clap.workspace = true
half.workspace = true
memmap2.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
blaze-chat = { path = "../blaze-chat" }
axum.workspace = true
tokio.workspace = true
futures.workspace = true
async-stream.workspace = true
uuid.workspace = true
minijinja = { version = "2.24.0", features = ["unstable_machinery"] }
llguidance = { version = "1.9.1", default-features = false, features = ["lark", "referencing", "ahash"] }
toktrie_hf_tokenizers = "1.9.1"
# image input: decoders only (no encoders, no color management beyond the format's own)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
# http(s) image URLs (already in the lock through hf-hub: rustls, no extra crates)
ureq = { version = "2", default-features = false, features = ["tls"] }
# image URLs parsed as ureq does (WHATWG); image content keys (both in the lock already)
url = "2.5"
blake3 = "1.8"
http-body-util = "0.1"
# Router::oneshot: the early listener hands requests to the API once it is up (already in the lock through axum)
tower = { version = "0.5", default-features = false, features = ["util"] }
